<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yash Verma</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#F7F5F0">
<style>
@font-face{font-family:"Fraunces";src:url(fonts/fraunces-var.woff2) format("woff2-variations");font-weight:300 700;font-style:normal;font-display:swap}
:root{--paper:#F7F5F0;--ink:#1A1A1A;--ink-2:#5F5C58;--rule:#E2DDD3}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);
  font:400 17px/1.6 "Fraunces",Georgia,"Times New Roman",serif;
  display:flex;align-items:center;justify-content:flex-start;padding:0 8vw;
  -webkit-font-smoothing:antialiased}
main{max-width:34ch}
h1{margin:0;font-size:15px;font-weight:500;letter-spacing:.01em;color:var(--ink-2);
  font-family:Georgia,"Times New Roman",serif}
p.line{margin:28px 0 0;font-size:44px;line-height:1.1;letter-spacing:-.02em;
  font-variation-settings:"opsz" 120,"wght" 380,"WONK" 1}
hr{border:0;border-top:1px solid var(--rule);margin:36px 0 0;width:72px}
@media (max-width:640px){body{padding:0 24px}p.line{font-size:32px}}
</style>
</head><body>
<main>
<h1>Yash Verma</h1>
<p class="line">Coming soon.</p>
<hr>
</main>
</body></html>
